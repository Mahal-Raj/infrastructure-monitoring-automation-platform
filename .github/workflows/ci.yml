name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run Java, Python, and Bash validation
        run: bash scripts/test.sh
      - name: Validate Docker Compose model
        run: docker compose config --quiet
      - name: Build controller and agent images
        run: docker compose build
